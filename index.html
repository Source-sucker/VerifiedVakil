<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Concourse - FIFA World Cup 2026 Operations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/styles/main.css">

  <!-- External libraries via CDN with SRI -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"
    integrity="sha512-dfX5uYVXzyU8+KHqj8bjo7UkOdg18PaOtpa48djpNbZHwExddghZ+ZmzWT06R5v6NSk3ZUfsH6FNEDepLx9hPQ=="
    crossorigin="anonymous" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"
    integrity="sha512-b5ZVZIcaMT1TE/MPI+io8J2ZLN4hYa4aTfw/1WAp5P2fNcKLdsFqmE/TENSbH9Fy5Hn8jvs3BKCQQZvMdMa7nA=="
    crossorigin="anonymous" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"
    integrity="sha512-CQBWl4fJHWbryGE+Pc7UAxWMUMNMWzWxF4SQo9CgkJIN1kx6djDQZjh3Y8SZ1d+6I+1zze6Z7kHXO7q3UyZAWw=="
    crossorigin="anonymous" defer></script>
</head>
<body>
  <!-- Skip to main content for keyboard users -->
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <h1 class="app-title">Concourse</h1>
      <p class="app-subtitle">FIFA World Cup 2026 Operations</p>

      <nav class="module-nav" role="navigation" aria-label="Main navigation">
        <button class="nav-btn" data-module="crowd" aria-label="Crowd Intelligence">Crowd</button>
        <button class="nav-btn" data-module="incident" aria-label="Incident Command">Incident</button>
        <button class="nav-btn" data-module="navigation" aria-label="Wayfinding & Navigation">Nav</button>
        <button class="nav-btn" data-module="transit" aria-label="Transit Intelligence">Transit</button>
        <button class="nav-btn" data-module="medical" aria-label="Medical Ops">Medical</button>
        <button class="nav-btn" data-module="volunteers" aria-label="Volunteer Coordination">Volunteers</button>
        <button class="nav-btn" data-module="sustainability" aria-label="Sustainability Telemetry">Sustain</button>
        <button class="nav-btn" data-module="translate" aria-label="Multilingual Fan Assistance">Language</button>
        <button class="nav-btn" data-module="brief" aria-label="AI Morning Brief & Analytics">Brief</button>
      </nav>

      <div class="upload-controls">
        <label class="upload-btn">
          <input type="file" id="file-upload" accept=".csv,.json,.pdf" aria-label="Upload data file">
          <span>Upload Data</span>
        </label>
        <span id="upload-status" class="upload-status" role="status" aria-live="polite"></span>
      </div>
    </header>

    <!-- Main layout -->
    <main id="main-content" class="app-main">
      <!-- Stadium map (signature element) -->
      <section class="stadium-map" aria-label="Stadium gate visualization">
        <svg id="stadium-svg" viewBox="0 0 800 400" role="img" aria-label="Stadium gates showing current occupancy levels">
          <!-- Gates will be rendered dynamically -->
        </svg>
      </section>

      <!-- Active module panel -->
      <section class="module-panel" id="module-panel" aria-live="polite">
        <div id="module-content">
          <!-- Module content loaded here -->
        </div>
      </section>
    </main>

    <!-- Insight feed -->
    <aside class="insight-feed" aria-label="Operational insights">
      <h2 class="feed-title">Insights</h2>
      <div id="insight-list" class="feed-list" role="log" aria-live="polite" aria-atomic="false">
        <!-- Insights appear here -->
      </div>
    </aside>
  </div>

  <!-- Load app modules -->
  <script type="module" src="src/app.js"></script>
</body>
</html>
